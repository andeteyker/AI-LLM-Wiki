[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os"
version = "0.1.0"
description = "Local-first AI-OS scaffold"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OpenAI", email = "noreply@example.com"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "streamlit>=1.44.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
  "watchdog>=4.0.1",
  "markdown>=3.6",
  "python-slugify>=8.0.4",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.3.1"]
search = ["whoosh>=2.7.4"]
ollama = ["httpx>=0.27.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
