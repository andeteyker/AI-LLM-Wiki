[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-compiler"
version = "0.1.0"
description = "Local-first LLM Wiki Compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "watchfiles>=0.22.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
wiki = "llm_wiki.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
